name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.label }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin
            label: macOS (Apple Silicon)
          - os: macos-latest
            args: --target x86_64-apple-darwin
            label: macOS (Intel)
          - os: ubuntu-22.04
            args: ""
            label: Linux (x86_64)
          - os: windows-latest
            args: ""
            label: Windows (x86_64)
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Linux system dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            libgtk-3-dev \
            patchelf

      - uses: pnpm/action-setup@v4
        with:
          version: 9.10.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both macOS slices are built so the Intel and ARM machines each get a
          # native bundle.
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      # On a tag push this creates a (draft) GitHub release and uploads the
      # installers to it. On a manual run there is no tag, so tagName is empty
      # and tauri-action just stores the bundles as workflow artifacts.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: "transgui-next v__VERSION__"
          # Release notes live in RELEASE_NOTES.md so they can be edited like any
          # other file. Two gotchas, both verified against v0.1.0:
          #  1. tauri-action only writes the body when it CREATES the release
          #     (`body_path contents || releaseBody`). If a release for the tag
          #     already exists, its body is left untouched — notes edited after
          #     the fact must be changed on the release page itself.
          #  2. While a release is a draft, the public /releases/tag/<tag> page
          #     and releases.atom serve the tag's annotation, not the body, so
          #     they cannot be used to verify the notes.
          body_path: RELEASE_NOTES.md
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
